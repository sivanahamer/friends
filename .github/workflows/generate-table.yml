name: Generate Attestation Sources Table

on:
  push:
    branches: [main]
    paths:
      - 'list_sources/**/README.md'
  workflow_dispatch:

jobs:
  generate-table:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Generate table
        run: python .github/scripts/generate_table_producers.py

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet list_producers/README.md; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: 'chore: regenerate attestation sources table'
          title: 'chore: regenerate attestation sources table'
          body: |
            🤖 This PR was automatically generated to update the attestation sources table.
            
            **Changes:**
            - Updated documentation index based on source metadata
            - All changes have been validated
            
            **Action Required:**
            Please review and merge if the changes look correct.
          branch: 'chore/regenerate-table'
          labels: 'chore,auto-generated'
          token: ${{ secrets.GITHUB_TOKEN }}